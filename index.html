
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Information</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Welcome</h1>

        <p>
            This website can collect your public IP address
            and store it in the website owner's private
            Google spreadsheet.
        </p>

        <p>
            Your IP address is retrieved using ipify,
            a third-party IP lookup service.
        </p>

        <button id="consentButton">
            I agree to IP collection
        </button>

        <p id="status" aria-live="polite">
            No information has been collected.
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
